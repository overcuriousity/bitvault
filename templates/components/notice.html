{# kind: "info", "success", "warning" or "danger". #}
{% macro notice(kind, message) %}<div class="oc-notice oc-notice--{{ kind }}" role="status"><span class="oc-notice__text">{{ message }}</span></div>{% endmacro %}
{# html must already be escaped, for text that keeps quotation marks readable (see web::escape_text). #}
{% macro notice_escaped(kind, html) %}<div class="oc-notice oc-notice--{{ kind }}" role="status"><span class="oc-notice__text">{{ html|safe }}</span></div>{% endmacro %}
