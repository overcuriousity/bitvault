[package]
name = "bitvault"
version = "2026.11.0"
edition = "2024"
rust-version = "1.97"
authors = ["overcuriousity, originally Daniel Szabo <daniel@microbin.eu> and contributors"]
license = "GPL-3.0-only"
description = "A self-hosted pastebin with three-word addresses, server-side and browser-side encryption, and a REST API."
readme = "README.md"
repository = "https://github.com/overcuriousity/bitvault"
keywords = ["pastebin", "filesharing", "selfhosted"]
categories = ["web-programming"]
publish = false

[dependencies]
askama = "0.16"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
mime_guess = "2"
rand = "0.10.3"
rust-embed = { version = "8", features = ["debug-embed", "include-exclude"] }
sd-notify = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "compression-gzip", "compression-br", "trace", "sensitive-headers"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
figment = { version = "0.10", features = ["toml", "env", "test"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
