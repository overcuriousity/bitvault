# nginx in front of BitVault on the same host. The app owns all security headers; add none here.
# Replace vault.example.org and the certificate paths. For an airgapped box see AIRGAP.md.

server {
    listen 80;
    listen [::]:80;
    server_name vault.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vault.example.org;

    ssl_certificate     /etc/ssl/certs/vault.example.org.pem;
    ssl_certificate_key /etc/ssl/private/vault.example.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # max_file_mb (2048 by default) plus the form overhead. Raise it together with max_file_mb.
    client_max_body_size 2049m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads stream straight to the app: the home form and the API.
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/pastes {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # File and zip downloads, web and API, are streamed, not buffered to disk.
    location ~ ^(/api/v1/pastes)?/[a-z]+-[a-z]+-[a-z]+/(file|zip) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

